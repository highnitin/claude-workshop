<style>
:root{
  --bg:#0b0d11; --bg-soft:#12151b; --card:#141821; --card-2:#1a1e26;
  --line:rgba(238,240,233,.10); --line-strong:rgba(198,242,74,.30);
  --gold:#c6f24a; --gold-bright:#d8ff63; --gold-deep:#5f7d0c; --gold-ink:#0b0d11;
  --text:#eef0e9; --dim:#9aa2af; --faint:#636b78;
  --serif:'Space Grotesk','Satoshi',sans-serif;
  --sans:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 520px at 78% -8%, rgba(198,242,74,.11), transparent 62%),
    radial-gradient(700px 400px at -10% 30%, rgba(198,242,74,.05), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
a{color:var(--gold-bright)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:6px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg, rgba(18,16,22,.92), rgba(7,6,10,.92));
  padding:24px 20px;display:flex;flex-direction:column;gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand img{width:46px;height:46px;border-radius:50%;flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.2}
.brand b span{color:var(--gold)}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.progress-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--dim)}
.progress-top strong{font-size:20px;color:var(--gold-bright);font-weight:700}
.bar{height:6px;border-radius:99px;background:rgba(198,242,74,.14);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-bright));border-radius:99px;transition:width .35s ease}
.nav{list-style:none;display:flex;flex-direction:column;gap:4px}
.nav button{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--dim);
  padding:9px 10px;border-radius:10px;font-size:14px;transition:background .15s,color .15s,border-color .15s;
}
.nav button:hover{background:rgba(198,242,74,.06);color:var(--text)}
.nav button[aria-current="step"]{background:rgba(198,242,74,.10);border-color:var(--line-strong);color:var(--text)}
.nav .dot{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:600;border:1px solid var(--line-strong);color:var(--gold);
}
.nav .done .dot{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.nav .lbl{flex:1;min-width:0;line-height:1.3}
.nav .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.save{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
.save i{width:8px;height:8px;border-radius:50%;background:#6fbf8f;flex:none}
.save.warn i{background:#e0a050}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools button{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:6px 10px;border-radius:8px}
.tools button:hover{color:var(--text);border-color:var(--line-strong)}
.tools .danger:hover{color:#f0a3a3;border-color:rgba(240,163,163,.4)}

.main{padding:44px 48px 80px;min-width:0}
.wrap{max-width:820px;margin:0 auto}
.section{display:none;animation:fade .35s ease}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- type ---------- */
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(34px,5vw,52px);margin:14px 0 16px}
h1 em,h2 em{font-style:italic;color:var(--gold-bright);font-weight:500}
h2{font-size:clamp(28px,4vw,40px);margin:10px 0 10px}
h3{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:40px 0 16px;display:flex;align-items:center;gap:12px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{font-size:18px;color:var(--dim);max-width:640px}
.goal{color:var(--dim);font-size:17px;max-width:640px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{font-size:12px;border:1px solid var(--line-strong);color:var(--gold-bright);padding:4px 12px;border-radius:99px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.simple{
  margin-top:26px;border:1px solid var(--line);border-left:3px solid var(--gold);
  background:linear-gradient(90deg, rgba(198,242,74,.08), rgba(198,242,74,.02));
  border-radius:12px;padding:16px 18px;
}
.simple b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.simple p{color:var(--text)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.fact strong{display:block;font-family:var(--serif);font-size:26px;color:var(--gold-bright);font-weight:600}
.fact span{font-size:13px;color:var(--dim)}
.lemon{list-style:none;counter-reset:l;margin-top:12px;display:grid;gap:8px}
.lemon li{counter-increment:l;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;font-size:15px}
.lemon li::before{content:counter(l);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.lemon li em{font-style:normal;color:var(--dim)}
.lemon li small{font-size:11px;color:var(--gold);border:1px solid var(--line-strong);border-radius:99px;padding:1px 8px;white-space:nowrap}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.how div{font-size:14px;color:var(--dim);padding-left:22px;position:relative}
.how div::before{content:"✦";position:absolute;left:0;color:var(--gold)}

/* ---------- questions ---------- */
.q{margin-bottom:26px}
.q label,.q .qlabel{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
.q label .n{color:var(--gold);margin-right:6px;font-variant-numeric:tabular-nums}
.tip{font-size:14px;color:var(--dim);margin-bottom:10px}
textarea,input[type=text],input[type=number],input[type=date],select{
  width:100%;background:var(--bg-soft);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.55;
  transition:border-color .15s, box-shadow .15s;
}
textarea{resize:vertical;min-height:84px;overflow:hidden}
textarea.short{min-height:52px}
textarea::placeholder,input::placeholder{color:var(--faint)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,242,74,.15)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input[type=date]{color-scheme:dark}
details.ex{margin-top:8px}
details.ex summary{list-style:none;cursor:pointer;font-size:13px;color:var(--gold);display:inline-flex;align-items:center;gap:6px;user-select:none}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary::before{content:"+";display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--line-strong);border-radius:50%;font-size:12px;line-height:1}
details.ex[open] summary::before{content:"–"}
details.ex p{margin-top:8px;font-size:14px;color:var(--dim);background:rgba(198,242,74,.05);border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px}
.decisions{background:linear-gradient(180deg,rgba(198,242,74,.07),rgba(198,242,74,.02));border:1px solid var(--line-strong);border-radius:var(--radius);padding:24px 24px 4px;margin-top:8px}
.decisions .q label{font-size:15px}
.sub{font-size:14px;color:var(--dim);margin:-6px 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg-soft);border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:99px;font-size:14px;transition:all .15s}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip[aria-pressed="true"]{background:rgba(198,242,74,.16);border-color:var(--gold);color:var(--gold-bright)}
.chip[aria-pressed="true"]::before{content:"✓ "}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg-soft)}
table.edit{width:100%;border-collapse:collapse;min-width:620px}
table.edit th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(198,242,74,.05)}
table.edit td{border-bottom:1px solid var(--line);padding:0;vertical-align:top}
table.edit tr:last-child td{border-bottom:0}
table.edit td+td,table.edit th+th{border-left:1px solid var(--line)}
table.edit textarea{border:0;border-radius:0;background:transparent;min-height:46px;padding:11px 12px;font-size:14px;resize:none}
table.edit textarea:focus{box-shadow:inset 0 0 0 2px rgba(198,242,74,.35)}
table.edit .x{width:38px;text-align:center;vertical-align:middle}
table.edit .x button{background:none;border:0;color:var(--faint);font-size:18px;width:32px;height:32px;border-radius:8px}
table.edit .x button:hover{color:#f0a3a3;background:rgba(240,163,163,.08)}
.add-row{margin-top:10px}

/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.builder .bf label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.preview{margin-top:16px;padding:18px 20px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg-soft);font-family:var(--serif);font-size:19px;line-height:1.55}
.preview .blank{color:var(--faint);font-family:var(--sans);font-size:15px;border-bottom:1px dashed var(--faint)}
.preview .fill{color:var(--gold-bright)}

/* ---------- calculator ---------- */
.calc-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
.calc-inputs label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.calc-inputs .hint{font-size:12px;color:var(--faint);margin-top:4px}
.inp{position:relative}
.inp .unit{position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font-weight:600;font-size:15px;pointer-events:none}
.inp .unit.pre{left:14px}.inp .unit.post{right:14px}
.inp input.has-pre{padding-left:32px}.inp input.has-post{padding-right:36px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:8px 16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.calc-out{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat span{display:block;font-size:12px;color:var(--dim);line-height:1.35}
.stat strong{display:block;font-size:24px;font-weight:700;color:var(--gold-bright);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formula{font-size:13px;color:var(--faint);margin-top:14px}
.calc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;border:1px solid transparent;text-decoration:none;transition:transform .1s, box-shadow .15s, background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:var(--gold-ink);box-shadow:0 6px 24px -8px rgba(198,242,74,.6)}
.btn.primary:hover{box-shadow:0 8px 30px -6px rgba(198,242,74,.75)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn.ghost:hover{background:rgba(198,242,74,.08)}
.btn.small{padding:8px 14px;font-size:13px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
.pager .btn{max-width:48%}
.pager .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px}
.cta{margin-top:36px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.cta img{width:72px;height:72px;border-radius:50%}
.cta h4{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:4px}
.cta p{color:var(--dim);font-size:15px;margin-bottom:12px}
.foot{margin-top:56px;font-size:13px;color:var(--faint);text-align:center}
.foot a{color:var(--dim)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--card-2);border:1px solid var(--line-strong);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#printView{display:none}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line);background:rgba(7,6,10,.94);backdrop-filter:blur(10px)}
  .brand img{width:34px;height:34px}.brand b{font-size:15px}.brand small{display:none}
  .side-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .progress-box{padding:0;border:0;background:none;min-width:120px;flex:1;max-width:200px}
  .progress-top{font-size:12px}.progress-top strong{font-size:15px}.bar{margin-top:4px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{white-space:nowrap;padding:6px 10px 6px 6px;width:auto}
  .nav .dot{width:22px;height:22px;font-size:11px}
  .nav .cnt{display:none}
  .side-foot{display:none}
  .hide-sm{display:none}
  .progress-top span{text-transform:capitalize}
  .main{padding:28px 16px 64px}
  .mobile-tools{display:block!important}
}
@media (min-width:981px){.side-top{display:flex;flex-direction:column;gap:22px}}
@media (max-width:640px){
  .facts{gap:8px}
  .fact{padding:12px 10px}
  .fact strong{font-size:20px}
  .fact span{font-size:12px;display:block;line-height:1.35}
  .how,.grid2,.builder,.calc-inputs{grid-template-columns:1fr}
  .calc-out{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{padding:12px}
  .stat strong{font-size:19px}
  .lemon li{grid-template-columns:24px 1fr}
  .lemon li small{grid-column:2;justify-self:start}
  .cta{grid-template-columns:1fr}
  .card,.decisions{padding:18px}
  .decisions{padding-bottom:2px}
  .pager .btn{padding:10px 12px;font-size:14px}
}
.mobile-tools{display:none;margin-top:40px}

/* ---------- print ---------- */
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff!important;color:#111}
  .app,.toast{display:none!important}
  #printView{display:block!important;font-family:var(--sans);font-size:11pt;line-height:1.5;color:#111}
  #printView h1{font-family:var(--serif);font-size:24pt;margin:0 0 4pt;color:#111}
  #printView .pv-brand{display:flex;align-items:center;gap:10pt;margin-bottom:14pt;padding-bottom:10pt;border-bottom:2px solid #4d6a08}
  #printView .pv-brand img{width:40pt;height:40pt;border-radius:50%}
  #printView .pv-brand small{display:block;color:#4d6a08;letter-spacing:.12em;text-transform:uppercase;font-size:8pt;font-weight:600}
  #printView .pv-meta{color:#555;font-size:10pt;margin-bottom:12pt}
  #printView h2{font-family:var(--serif);font-size:17pt;margin:22pt 0 6pt;color:#111;border-bottom:1px solid #d9e6b0;padding-bottom:4pt;break-after:avoid}
  #printView h2.plan{page-break-before:always}
  #printView h3{font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:#4d6a08;margin:12pt 0 4pt;display:block}
  #printView h3::after{display:none}
  #printView .qa{margin:0 0 8pt;break-inside:avoid}
  #printView .qa b{display:block;font-size:10pt}
  #printView .qa p{white-space:pre-wrap;margin:1pt 0 0}
  #printView .qa p.empty{color:#999;font-style:italic}
  #printView table{width:100%;border-collapse:collapse;margin:4pt 0 10pt;font-size:9.5pt;break-inside:avoid}
  #printView th,#printView td{border:1px solid #d3ddb5;padding:4pt 6pt;text-align:left;vertical-align:top;white-space:pre-wrap}
  #printView th{background:#eef6d0}
  #printView .pv-foot{margin-top:24pt;color:#777;font-size:9pt;text-align:center}
}
</style>
</head>

  { id:"offer", num:1, nav:"Your Offer", title:"Your <em>Offer</em>", time:"5 min",
    goal:"Get crystal clear on what you sell, what it costs and the result your buyer walks away with.",

      {t:"q", id:"offer_what", label:"What exactly are you selling?", tip:"Describe the product or service, its format and how long it lasts.", ex:"A 21-day live online yoga program: 45-minute morning sessions on Zoom, plus a WhatsApp group for questions."},

  { id:"customer", num:2, nav:"Ideal Customer", title:"Your Ideal <em>Customer</em>", time:"7 min",

    simple:"Your best customers are the hot, thirsty kids walking out of the park — not grandma, who only drinks tea. Sell to people who already want what you have.",
    blocks:[
      {t:"h", text:"Questions"},
      {t:"q", id:"cust_who", label:"Who is your ideal customer?", tip:"Age, job, life or business stage, income, location. The more specific, the better.", ex:"Working women aged 28–45 in Indian metros, in desk jobs, earning ₹6L+ a year."},
      {t:"q", id:"cust_problem", label:"What problem or desire makes them look for a solution right now?", tip:"Write it in the words they would use.", ex:"\"My back hurts after sitting all day, and I have no time for the gym.\""},

      {t:"dec", items:[

        {id:"dec_cust_objections", label:"Main objections to answer", ex:"No time · \"online won't work\" · price"}
      ]}
    ]},

    simple:"Walk around the park and look at the other lemonade stands. What do they sell? What do they charge? What are kids complaining about? Every complaint is an opportunity for you.",
    blocks:[
      {t:"h", text:"Questions"},
      {t:"q", id:"mkt_alts", label:"Who or what else could your customer choose instead of you?", tip:"Include direct competitors, cheaper do-it-yourself options, and simply doing nothing.", ex:"Local yoga studios, fitness apps, free YouTube channels, physiotherapy — or just living with the pain."},
      {t:"q", id:"mkt_promises", label:"What do they promise, and what do they charge?", tip:"Look at their websites, ads and social pages.", ex:"Studios: ₹3,000–5,000 a month, fixed timings. Apps: ₹500 a month, no personal attention. YouTube: free, nobody checks your form."},

        {id:"dec_mkt_gap", label:"The gap we will own", ex:"Personal, live, back-pain-focused yoga for desk workers"}

  { id:"position", num:4, nav:"Positioning & Message", title:"Positioning &amp; <em>Message</em>", time:"8 min",

function fresh(){ return {v:1, f:{}, chips:{}, tables:{}, calc:{cur:"₹"}, updated:null}; }
var S = fresh();
var storageOK = true;

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.v===1){ S = sanitize(d); } }
  }catch(e){ storageOK = false; }
}
function sanitize(d){
  var s = fresh();
  if(d.f && typeof d.f==="object") Object.keys(d.f).forEach(function(k){ if(typeof d.f[k]==="string") s.f[k]=d.f[k]; });
  if(d.chips && typeof d.chips==="object") Object.keys(d.chips).forEach(function(k){ if(Array.isArray(d.chips[k])) s.chips[k]=d.chips[k].filter(function(x){return typeof x==="string";}); });
  if(d.tables && typeof d.tables==="object") Object.keys(d.tables).forEach(function(k){
    if(Array.isArray(d.tables[k])) s.tables[k]=d.tables[k].filter(Array.isArray).map(function(r){return r.map(function(c){return typeof c==="string"?c:"";});});
  });
  if(d.calc && typeof d.calc==="object") ["cur","goal","price","show","buy","cpl"].forEach(function(k){ if(d.calc[k]!=null) s.calc[k]=String(d.calc[k]); });
  if(s.calc.cur!=="₹" && s.calc.cur!=="$") s.calc.cur="₹";
  s.updated = d.updated || null;
  return s;
}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    S.updated = new Date().toISOString();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
    catch(e){ storageOK = false; }
    renderSaveStatus();
  }, 300);
}
function renderSaveStatus(){
  ["saveStatus","saveStatus2"].forEach(function(id){
    var el = document.getElementById(id); if(!el) return;
    el.classList.toggle("warn", !storageOK);
    el.querySelector("span").textContent = storageOK ? "Saved in this browser" : "Not saving — this browser blocks storage. Use Download backup.";
  });
}

/* ============================================================
   CALCULATOR
   ============================================================ */
function num(x){ var n=parseFloat(String(x==null?"":x).replace(/,/g,"")); return isFinite(n)?n:NaN; }
function fmt(n){ var loc = S.calc.cur==="₹" ? "en-IN" : "en-US"; return Math.round(n).toLocaleString(loc); }
function money(n){ return S.calc.cur + fmt(n); }
function calcResult(){
  var c=S.calc, goal=num(c.goal), price=num(c.price), show=num(c.show), buy=num(c.buy), cpl=num(c.cpl);
  if(!(goal>0 && price>0)) return null;
  var r={};
  r.sales = Math.ceil(goal/price);
  r.revenue = r.sales*price;
  if(buy>0 && buy<=100){ r.engaged = Math.ceil(r.sales/(buy/100)); }
  if(r.engaged && show>0 && show<=100){ r.leads = Math.ceil(r.engaged/(show/100)); }
  if(r.leads && cpl>=0 && c.cpl!=="" && c.cpl!=null){ r.budget = r.leads*cpl; if(r.budget>0){ r.cps=r.budget/r.sales; r.roas=r.revenue/r.budget; } }
  return r;
}
function calcSummary(){
  var r=calcResult(); if(!r) return "";
  var parts=["To reach "+money(num(S.calc.goal))+": "+fmt(r.sales)+" sales"];
  if(r.engaged) parts.push(fmt(r.engaged)+" people at the next step");
  if(r.leads) parts.push(fmt(r.leads)+" leads");
  var s=parts.join(" ← ");
  if(r.budget!=null) s += " · Ad budget ≈ "+money(r.budget);
  if(r.cps) s += " · Cost per sale ≈ "+money(r.cps);
  if(r.roas) s += " · Return on ad spend ≈ "+r.roas.toFixed(2)+"x";
  return s;
}
function renderCalcOut(){
  var box=document.getElementById("calcOut"); if(!box) return;
  var r=calcResult(), dash="—";
  var cells=[
    ["Sales needed per month", r? fmt(r.sales):dash],
    ["People at the next step", r&&r.engaged? fmt(r.engaged):dash],
    ["Leads needed per month", r&&r.leads? fmt(r.leads):dash],
    ["Ad budget per month", r&&r.budget!=null? money(r.budget):dash],
    ["Cost per sale", r&&r.cps? money(r.cps):dash],
    ["Return on ad spend", r&&r.roas? r.roas.toFixed(2)+"x":dash]
  ];
  box.innerHTML = cells.map(function(c){ return '<div class="stat"><span>'+esc(c[0])+'</span><strong>'+esc(c[1])+'</strong></div>'; }).join("");
  document.querySelectorAll("[data-cur]").forEach(function(u){ u.textContent=S.calc.cur; });
  document.querySelectorAll("[data-curbtn]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-curbtn")===S.calc.cur)); });
}

   ============================================================ */
function countables(sec){
  var list=[];
  if(sec.type==="intro"){ SETUP.forEach(function(f){ if(f.count) list.push(function(){ return !!v(f.id); }); }); return list; }
  if(sec.type==="final") return list;
  sec.blocks.forEach(function(b){
    if(b.t==="q") list.push(function(){ return !!v(b.id); });
    else if(b.t==="dec") b.items.forEach(function(d){ list.push(function(){ return !!v(d.id); }); });
    else if(b.t==="table") list.push(function(){ return tableHasContent(b.id); });
    else if(b.t==="chips") list.push(function(){ return (S.chips[b.id]||[]).length>0; });
    else if(b.t==="builder") list.push(function(){ return BUILDER.every(function(x){ return !!v(x.id); }); });
    else if(b.t==="calc") list.push(function(){ return !!calcResult(); });
  });
  return list;
}
function updateProgress(){
  var total=0, done=0;
  SECTIONS.forEach(function(s){
    var c=countables(s), d=c.filter(function(fn){return fn();}).length;
    total+=c.length; done+=d;
    var cnt=document.querySelector('[data-cnt="'+s.id+'"]');
    var btn=document.querySelector('[data-go="'+s.id+'"]');
    if(cnt) cnt.textContent = c.length ? d+"/"+c.length : "";
    if(btn && btn.parentNode) btn.parentNode.classList.toggle("done", c.length>0 && d===c.length);
  });
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById("pct").textContent = pct+"%";
  document.getElementById("barFill").style.width = pct+"%";
}

function joinLines(){ return Array.prototype.slice.call(arguments).filter(function(x){ return x && String(x).trim(); }).join("\n"); }
function lab(l,x){ return x ? l+": "+x : ""; }
function first(){ for(var i=0;i<arguments.length;i++){ if(arguments[i]) return arguments[i]; } return ""; }

function autoPlan(){
  var chips=(S.chips.ch_list||[]);
  var site=v("setup_site");
  return {
    plan_snapshot: joinLines(v("setup_name") && (v("setup_name")+(v("setup_stage")?" — "+v("setup_stage"):"")), v("setup_line"), site),
    plan_offer: joinLines(lab("Offer",v("dec_offer_name")), lab("Price",first(v("dec_offer_price"),v("offer_price"))), lab("Promise",first(v("dec_offer_promise"),v("offer_result"))), lab("Delivery",first(v("dec_offer_format"),v("offer_what")))),
    plan_customer: first(v("dec_cust_segment"), v("cust_who")),
    plan_problem: joinLines(first(v("dec_cust_pain"),v("cust_problem")), lab("Buying triggers",first(v("dec_cust_triggers"),v("cust_triggers"))), lab("Objections to answer",first(v("dec_cust_objections"),v("cust_objections")))),
    plan_gap: joinLines(first(v("dec_mkt_gap"),v("mkt_gap")), lab("Main alternatives",first(v("dec_mkt_alts"),v("mkt_alts"))), lab("Complaints we fix",v("dec_mkt_complaints"))),
    plan_positioning: first(v("dec_pos_statement"), builderSentence(true)),
    plan_message: joinLines(first(v("dec_pos_message"),v("pos_remember")), lab("Proof",first(v("dec_pos_proof"),v("pos_proof"))), lab("Tone",v("dec_pos_tone"))),
    plan_angles: joinLines(lab("A — Pain",v("pos_angle_a")), lab("B — Proof",v("pos_angle_b")), lab("C — Dream outcome",v("pos_angle_c"))),
    plan_channels: joinLines(lab("Primary",v("dec_ch_primary")), lab("Supporting",v("dec_ch_support")), (!v("dec_ch_primary")&&!v("dec_ch_support"))?v("ch_choose"):"", chips.length?lab("Channels shortlisted",chips.join(", ")):""),
    plan_funnel: joinLines(v("dec_ch_funnel"), lab("1. Attention",v("fn_attention")), lab("2. Free step",v("fn_free")), lab("3. Conversion",v("fn_buy")), lab("4. Follow-up",v("fn_follow"))),
    plan_numbers: joinLines(lab("Monthly goal",v("dec_num_goal")), calcSummary(), lab("Budget",first(v("dec_num_budget"),v("num_budget"))), lab("Targets",v("dec_num_targets")), lab("Team and tools",first(v("dec_num_team"),v("num_team")))),
    plan_experiment: joinLines(first(v("dec_exp_test"),v("exp_how")), lab("Hypothesis",v("exp_hypothesis"))),
    plan_metrics: joinLines(lab("Success looks like",v("dec_exp_success")), v("exp_metrics"), lab("Change or stop if",v("dec_exp_stop"))),
    plan_assumptions: first(v("dec_exp_assumptions"), v("exp_assumptions"))
  };
}
function buildPlan(){
  var auto=autoPlan(), conflicts=[], empties=[];
  Object.keys(auto).forEach(function(k){
    var a=(auto[k]||"").trim(), cur=v(k);
    if(!a) return;
    if(!cur) empties.push(k); else if(cur!==a) conflicts.push(k);
  });
  var roadSrc=(S.tables.tbl_roadmap||[]).filter(function(r){ return r.some(function(c){return c&&c.trim();}); });
  var roadState = !roadSrc.length ? "none" : !tableHasContent("plan_roadmap") ? "empty" : JSON.stringify(roadSrc)!==JSON.stringify((S.tables.plan_roadmap||[]).filter(function(r){return r.some(function(c){return c&&c.trim();});})) ? "conflict" : "same";
  var nConf = conflicts.length + (roadState==="conflict"?1:0);
  if(!empties.length && !nConf && roadState!=="empty"){
    toast(Object.keys(auto).some(function(k){return auto[k];}) ? "Your plan is already up to date." : "Fill in a few exercises first — then build your plan.");
    return;
  }
  var replace=false;
  if(nConf){
    replace = window.confirm("You've edited "+nConf+" plan field"+(nConf>1?"s":"")+" yourself.\n\nOK — replace "+(nConf>1?"them":"it")+" with fresh text from your answers.\nCancel — keep your edits and only fill the empty fields.");
  }
  var changed=0;
  empties.forEach(function(k){ S.f[k]=auto[k]; changed++; });
  if(replace) conflicts.forEach(function(k){ S.f[k]=auto[k]; changed++; });
  if(roadState==="empty" || (replace && roadState==="conflict")){ S.tables.plan_roadmap = roadSrc.map(function(r){return r.slice();}); changed++; }
  save();
  var planSec=document.getElementById("sec-plan");
  var i=SECTIONS.map(function(s){return s.id;}).indexOf("plan");
  var fresh=el(renderSection(SECTIONS[i], i));
  planSec.parentNode.replaceChild(fresh, planSec);
  fillValues(); show("plan", false); updateProgress();
  toast(changed ? "Plan built — "+changed+" field"+(changed>1?"s":"")+" filled. Edit anything you like." : "Kept your edits. Nothing else to fill.");
}

function docModel(onlyPlan){
  var out=[];
  SECTIONS.forEach(function(sec){
    if(onlyPlan && sec.type!=="final") return;
    if(sec.type==="intro"){
      return;
    }
    out.push({k:"h2", text:(sec.type==="final"?"":"Exercise "+sec.num+": ")+stripTags(sec.title), plan:sec.type==="final"});
    if(sec.goal && sec.type!=="final") out.push({k:"p", text:sec.goal});
    sec.blocks.forEach(function(b){
      if(b.t==="h") out.push({k:"h3", text:b.text});
      else if(b.t==="q") out.push({k:"qa", label:b.label, val:v(b.id)});
      else if(b.t==="table"){
        var rows=(S.tables[b.id]||[]).filter(function(r){return r.some(function(c){return c&&c.trim();});});
        if(b.label) out.push({k:"h3", text:b.label});
        out.push({k:"table", cols:b.cols, rows:rows});
      }
      else if(b.t==="chips") out.push({k:"qa", label:"Channels shortlisted", val:(S.chips[b.id]||[]).join(", ")});
      else if(b.t==="builder"){
        BUILDER.forEach(function(x){ if(v(x.id)) out.push({k:"qa", label:x.label, val:v(x.id)}); });
        out.push({k:"qa", label:"Positioning statement (builder)", val:builderSentence(true)});
      }
      else if(b.t==="calc"){
        var c=S.calc, r=calcResult();
        out.push({k:"qa", label:"Inputs", val: r ? "Goal "+money(num(c.goal))+" · Price "+money(num(c.price))+(c.show?" · Next step "+c.show+"%":"")+(c.buy?" · Buy "+c.buy+"%":"")+(c.cpl?" · Cost per lead "+money(num(c.cpl)):"") : ""});
        out.push({k:"qa", label:"Result", val:calcSummary()});
      }
      else if(b.t==="dec"){
        out.push({k:"h3", text:"Decisions to record"});
        b.items.forEach(function(d){ out.push({k:"qa", label:d.label, val:v(d.id)}); });
      }
    });
  });
  return out;
}
function header(){

function mdCell(s){ return String(s||"").replace(/\|/g,"\\|").replace(/\r?\n/g,"<br>"); }
function toMarkdown(){
  var h=header(), md=[];
  md.push("# GTM Strategy Workshop — "+h.name, "");
  h.lines.forEach(function(l){ md.push("_"+l+"_"); }); if(h.lines.length) md.push("");
  var model=docModel(false);
  var planIdx=-1; model.forEach(function(b,i){ if(b.plan && planIdx<0) planIdx=i; });
  // put the final plan first, then the full workbook
  var ordered = planIdx>-1 ? model.slice(planIdx).concat([{k:"hr"},{k:"h1", text:"Workbook — all exercise answers"}]).concat(model.slice(0,planIdx)) : model;
  ordered.forEach(function(b){
    if(b.k==="hr") md.push("---","");
    else if(b.k==="h1") md.push("# "+b.text,"");
    else if(b.k==="h2") md.push("## "+b.text,"");
    else if(b.k==="h3") md.push("### "+b.text,"");
    else if(b.k==="p") md.push("_"+b.text+"_","");
    else if(b.k==="qa") md.push("**"+b.label+"**", "", b.val ? b.val : "_Not answered yet_", "");
    else if(b.k==="table"){
      md.push("| "+b.cols.map(mdCell).join(" | ")+" |", "|"+b.cols.map(function(){return "---";}).join("|")+"|");
      if(b.rows.length) b.rows.forEach(function(r){ md.push("| "+b.cols.map(function(c,i){return mdCell(r[i]);}).join(" | ")+" |"); });
      else md.push("| "+b.cols.map(function(c,i){return i===0?"_Not filled yet_":"";}).join(" | ")+" |");
      md.push("");
    }
  });
  md.push("---","","_Made with the free GTM Strategy Workshop by "+BRAND+" — "+BRAND_URL+"_","");
  return md.join("\n");
}

function download(name, text, type){
  try{
    var blob=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();

  }catch(e){ toast("Your browser blocked the download."); return false; }
}

    if(i>-1) arr.splice(i,1); else arr.push(val);
    S.chips[id]=arr; t.setAttribute("aria-pressed", String(i<0)); save(); updateProgress(); return;
  }
  if(t.hasAttribute("data-addrow")){
    var tid=t.getAttribute("data-addrow"), def=findBlock(tid), rows=tableRows(tid,def);
    rows.push(def.cols.map(function(){return "";})); S.tables[tid]=rows; save(); rerenderTable(tid);
    var last=document.querySelectorAll('[data-t="'+tid+'"][data-c="0"]'); if(last.length) last[last.length-1].focus();

  }
  if(t.hasAttribute("data-delrow")){
    var did=t.getAttribute("data-delrow"), r=+t.getAttribute("data-r"), d=findBlock(did), rws=tableRows(did,d);
    if(rws[r] && rws[r].some(function(c){return c&&c.trim();}) && !window.confirm("Remove this row?")) return;

  if(t.hasAttribute("data-curbtn")){ S.calc.cur=t.getAttribute("data-curbtn"); save(); renderCalcOut(); return; }
  var act=t.getAttribute("data-act"); if(!act) return;
  if(act==="usePos"){

    if(v("dec_pos_statement") && v("dec_pos_statement")!==s && !window.confirm("Replace your current positioning statement with the one from the builder?")) return;
    S.f.dec_pos_statement=s; var f=document.getElementById("f_dec_pos_statement"); if(f){ f.value=s; autosize(f); }
    var gaps=BUILDER.filter(function(b){return !v(b.id);}).length;
    save(); updateProgress(); toast(gaps ? "Added to your decisions. "+gaps+" blank"+(gaps>1?"s are":" is")+" still marked in [brackets]." : "Added to your decisions."); return;
  }
  if(act==="calcExample"){

    S.calc.goal = S.calc.cur==="$" ? "20000" : "300000";
    S.calc.price = S.calc.cur==="$" ? "199" : "2999";
    S.calc.show="30"; S.calc.buy="10"; S.calc.cpl = S.calc.cur==="$" ? "4" : "40";
    fillValues(); save(); updateProgress(); return;
  }
  if(act==="build"){ buildPlan(); return; }
  if(act==="md"){ if(download(fileBase()+".md", toMarkdown(), "text/markdown;charset=utf-8")) toast("Markdown downloaded."); return; }
  if(act==="print"){ preparePrint(); window.print(); return; }
  if(act==="copy"){ copyText(toPlainPlan()); return; }
  if(act==="backup"){ if(download("gtm-workshop-backup-"+(slug(v("setup_name"))||"my-business")+".json", JSON.stringify(S,null,2), "application/json")) toast("Backup downloaded. Keep it safe."); return; }
  if(act==="restore"){ document.getElementById("fileIn").click(); return; }
  if(act==="clear"){
    if(!window.confirm("Clear every answer in this workshop?\n\nThis can't be undone. Download a backup first if you want to keep them.")) return;
    S=fresh(); S.f.setup_date=todayStr();
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    save(); location.hash="start"; renderAll(); toast("Workshop cleared."); return;
  }
});
document.getElementById("fileIn").addEventListener("change", function(e){
  var file=e.target.files && e.target.files[0]; if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d || d.v!==1 || typeof d.f!=="object") throw new Error("bad");
      if(!window.confirm("Replace everything in this workshop with the backup?")) return;
      S=sanitize(d); save(); renderAll(); toast("Backup restored.");
    }catch(err){ toast("That file isn't a workshop backup."); }
    e.target.value="";
  };
  rd.readAsText(file);
});
window.addEventListener("resize", function(){ document.querySelectorAll(".section.active textarea").forEach(autosize); });

/* ============================================================
   START
   ============================================================ */
load();
if(!S.f.setup_date) S.f.setup_date = todayStr();
renderAll();
renderSaveStatus();
if(!storageOK) toast("Heads up: this browser isn't saving. Use Download backup before you leave.");
})();
</script>
</body>
</html>
